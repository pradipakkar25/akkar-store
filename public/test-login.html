<!DOCTYPE html>
<html>
<head>
  <title>Test Login</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    input { display: block; width: 100%; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; background: #f97316; color: white; border: none; cursor: pointer; }
    .result { margin-top: 20px; padding: 10px; background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Admin Login</h1>
    <input type="email" id="email" placeholder="Email" value="pradipakkar557@gmail.com">
    <input type="password" id="password" placeholder="Password" value="pradip25082008">
    <button onclick="testLogin()">Test Login</button>
    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    async function testLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resultDiv = document.getElementById('result');

      try {
        console.log('Sending login request...');
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        console.log('Response:', data);

        resultDiv.style.display = 'block';
        
        if (!response.ok) {
          resultDiv.innerHTML = `<h3>❌ Login Failed</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        resultDiv.innerHTML = `
          <h3>✓ Login Successful!</h3>
          <pre>${JSON.stringify(data, null, 2)}</pre>
          <p>Token stored: ${data.token.substring(0, 50)}...</p>
          <p>User stored: ${JSON.stringify(data.user)}</p>
          <p><a href="/admin">Go to Admin Panel</a></p>
        `;
      } catch (error) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<h3>❌ Error</h3><pre>${error.message}</pre>`;
      }
    }
  </script>
</body>
</html>
